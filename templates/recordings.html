{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>

Recording History

</h2>

<table>

<tr>

<th>

Video

</th>

</tr>

{% for file in files %}

<tr>

<td>
    <a href="/recordings/{{file}}" target="_blank" class="btn">
        ▶ Play / Open
    </a>
</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
