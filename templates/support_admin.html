{% extends "base.html" %}

{% block content %}

<div class="card">

<div class="title">

Support Requests

</div>

<table>

<tr>

<th>User</th>

<th>Issue</th>

<th>Status</th>

</tr>

{% for s in requests %}

<tr>

<td>

{{ s[0] }}

</td>

<td>

{{ s[1] }}

</td>

<td>

{% if s[2]=="Pending" %}

🟡 Pending

{% elif s[2]=="Resolved" %}

🟢 Resolved

{% else %}

{{ s[2] }}

{% endif %}

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
