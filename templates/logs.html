{% extends "base.html" %}

{% block content %}

<h2>My Activity Logs</h2>

<table>

    <tr>
        <th>Action</th>
        <th>IP Address</th>
        <th>Type</th>
        <th>Timestamp</th>
    </tr>

    {% for log in logs %}

    <tr>
        <td>{{ log[0] }}</td>
        <td>{{ log[1] }}</td>
        <td>{{ log[2] }}</td>
        <td>{{ log[3] }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
