<!DOCTYPE html>
<html>

<head>
    <title>Activity Logs</title>
    <meta http-equiv="refresh" content="5">
</head>

<body>

<h2>ACTIVITY LOGS</h2>

<table border="1">

<tr>
    <th>Username</th>
    <th>Action</th>
    <th>IP Address</th>
    <th>Timestamp</th>
</tr>

{% for log in logs %}
<tr>
    <td>{{ log[0] }}</td>
    <td>{{ log[1] }}</td>
    <td>{{ log[2] }}</td>
    <td>{{ log[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
