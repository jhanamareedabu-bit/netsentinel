<!DOCTYPE html>
<html>
<head>
    <title>NetSentinel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h2>NETSENTINEL</h2>

        <a href="/dashboard">Dashboard</a>
        {% if session['role']=="Admin" %}
        <a href="/cctv">CCTV Monitor</a>
        {% endif %}
        <a href="/logs">My Logs</a>

        {% if session['role'] == 'Admin' %}
            <a href="/admin">Admin Panel</a>
            <a href="/alllogs">System Logs</a>
            <a href="/notifications">Notifications</a>
        {% endif %}

        <a href="/logout">Logout</a>

        <a href="/password_resets">Password Reset Requests</a>

    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="main">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>
</html>
