<div class="login-container">

    <!-- LOGIN CARD -->
    <div class="login-card">

        <h1>NetSentinel</h1>
        <p class="subtitle">CCTV Monitoring System</p>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                LOGIN
            </button>

        </form>

    </div>

    <!-- CREATE ACCOUNT CARD -->
    <div class="register-card">

        <p>No account yet?</p>

        <a href="/register" class="register-btn">
            Create Account
        </a>

    </div>

</div>
